<title>GEO Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#060a14;--surface:#0d1526;--border:rgba(148,163,184,.16);--ink:#e6ecf8;--ink-2:#a3afc6;--ink-3:#66758f;--accent:#4f8cff;--accent-2:#22d3ee;--crit:#f87171}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);background-image:radial-gradient(900px 500px at 70% -10%,rgba(79,140,255,.16),transparent 60%),linear-gradient(rgba(148,163,184,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.035) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px}
.card{width:min(400px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px 30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:in .35s cubic-bezier(.16,1,.3,1)}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-family:Sora,sans-serif;font-weight:700;color:#04101f;box-shadow:0 10px 30px rgba(79,140,255,.25)}
b{font-family:Sora,sans-serif;font-size:1.05rem}small{display:block;color:var(--ink-3);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
p{margin:0 0 16px;color:var(--ink-2);font-size:.9rem;line-height:1.5}
label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;font-family:Sora,sans-serif}
input[type=password]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font:inherit;outline:none;transition:border-color .14s}input[type=password]:focus{border-color:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 18px;font-size:.84rem;color:var(--ink-2)}.row label{display:inline-flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-family:inherit;font-size:.84rem;color:var(--ink-2);margin:0;cursor:pointer}
button{width:100%;padding:11px;border-radius:10px;border:0;background:var(--accent);color:#04101f;font:inherit;font-weight:600;cursor:pointer;transition:filter .14s}button:hover{filter:brightness(1.1)}button:disabled{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:.84rem;min-height:1.2em;margin-top:10px}.foot{margin-top:18px;color:var(--ink-3);font-size:.72rem;text-align:center}
</style></head>
<body><form class="card" id="f"><div class="brand"><div class="mark">G</div><div><b>GEO Mission Control</b><small>Futnow · FTN Pro</small></div></div>
<p>Tableau de bord de l'équipe GEO. Le contenu est chiffré : il ne s'ouvre qu'avec le mot de passe de l'équipe.</p>
<label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password" autofocus required>
<div class="row"><label><input type="checkbox" id="r"> Se souvenir sur cet appareil</label></div>
<button id="b" type="submit">Ouvrir</button><div class="err" id="e" role="alert"></div>

<script>
(function(){
const ITER=200000,KEY="geo-dashboard-pass";
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
  const raw=b64($("blob").textContent.trim());
  if(new TextDecoder().decode(raw.slice(0,8))!=="Salted__")throw new Error("blob");
  const salt=raw.slice(8,16),data=raw.slice(16);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:ITER},km,384));
  const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  const gz=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,data);
  const ds=new DecompressionStream("gzip");const w=ds.writable.getWriter();w.write(new Uint8Array(gz));w.close();
  return await new Response(ds.readable).text();
}
async function go(pass,remember){
  $("b").disabled=true;$("e").textContent="";
  try{const html=await unlock(pass);
    try{sessionStorage.setItem(KEY,pass);if(remember)localStorage.setItem(KEY,pass)}catch(_){}
    document.open();document.write(html);document.close();
  }catch(err){$("e").textContent="Mot de passe incorrect.";try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch(_){}$("b").disabled=false;$("p").focus();$("p").select()}
}
$("f").addEventListener("submit",e=>{e.preventDefault();go($("p").value,$("r").checked)});
let saved=null;try{saved=sessionStorage.getItem(KEY)||localStorage.getItem(KEY)}catch(_){}
if(saved)go(saved,false);
})();
</script></body></html>
